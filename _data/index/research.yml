- name:
    detail: Northwestern University 
    i18n: company_y
  desc: 
    detail: Investigated the interpretability of Jailbreak strategies in safety-aligned LLMs using in-context learning and knowledge distillation to improve alignment and safety in superhuman AI systems, achieving a 14.41% increase in defense rate on the original models without compromising performance.Integrated a Modern Hopfield Network and Softmax1 into Foundation Models to tackle the challenge of no-op outliers and enhance model quantization robustness. This integration led to an average reduction of over 22% in output kurtosis and more than 26% in the maximum infinity norm across four models. Developed a robust, quantizable transformer-based framework extending Large Language Models to Multi-Modal Foundation Models (Text, Vision, Speech, Genome) to enable rapid adaptation and robust quantization using an outlier removal strategy. This approach achieved a 41% improvement in cross-modal low-rank adaptation, 45% enhancement in post-training quantization, and a 1.33x increase in training speed.Developed a novel LLM reasoning approach that combines Chain-of-Thought techniques with tool usage and memory retrieval, achieving a 3.42% improvement without information retrieval and a 6.14% boost with information retrieval over state-of-the-art baselines, such as SearchChain.
    i18n: company_y_desc
  date:
    detail: Dec. 2021 - Present
    i18n: company_y_date
  job:
    detail: Graduate Research Assistant
    i18n: company_y_job
  icon: fa-plus-square
  present: true


